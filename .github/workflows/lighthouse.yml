name: Lighthouse CI

on:
  push:
    branches: [main]

concurrency:
  group: lighthouse-main
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: "package.json"
      - run: bun ci
      - run: bun run build
      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
      - name: Print Lighthouse scores
        if: always()
        run: |
          for f in .lighthouseci/manifest*.json; do
            echo "=== $f ==="
            bunx --yes jq -r '
              .[] | .url as $u |
              "URL: \($u)",
              (.summary as $s |
                "performance: \($s.performance // "n/a")",
                "accessibility: \($s.accessibility // "n/a")",
                "best-practices: \($s["best-practices"] // "n/a")",
                "seo: \($s.seo // "n/a")"
              ),
              ""
            ' "$f"
          done
