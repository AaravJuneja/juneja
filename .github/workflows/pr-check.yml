name: PR Check

on:
  push:
    branches: [main]

concurrency:
  group: pr-check-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: "package.json"
      - run: bun ci
      - run: bun run build
      - run: bunx tsc --noEmit
      - run: bunx astro check
